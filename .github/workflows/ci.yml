# Promak CI.
#
# Every push runs the tests on Windows and Linux, and takes pictures of
# every screen.  A session in the cloud reads the results itself with
# tools/ci_status.py; it cannot read raw logs or artefacts, so:
#   - each test job ends with an annotation "pytest <os> py<ver>" carrying
#     the count, plus one error annotation per failing test;
#   - on main, the screens job force-pushes the pictures to the branch
#     "ci-renders" (one commit, replaced every run: a mailbox, not history).

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Libraries Qt needs on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - name: Install what the tests need
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q -rs --junitxml=junit.xml
      - name: Publish the count as an annotation the session can read
        if: always()
        run: python tools/ci_report.py junit.xml "pytest ${{ matrix.os }} py${{ matrix.python }}"

  screens:
    # Linux, because there the offscreen Qt finds real fonts; on the
    # Windows runner it draws every letter as an empty box.
    name: pictures of the screens
    runs-on: ubuntu-latest
    permissions:
      contents: write          # only to publish the ci-renders mailbox branch
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Libraries and fonts Qt needs on Linux
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core fonts-noto-core
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Take the pictures
        shell: bash
        run: |
          python tools/screenshots.py out
          echo "${GITHUB_SHA}" > out/SOURCE_SHA
          ls -la out
      - name: Upload the pictures
        uses: actions/upload-artifact@v6
        with:
          name: screens-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 30
      - name: Publish the pictures to the ci-renders branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b ci-renders
          git add .
          git -c user.name="promak-ci" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Screens for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-renders
