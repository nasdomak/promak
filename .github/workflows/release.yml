# Builds the Windows installer (no Python needed on the PC that runs it).
#
#   - on a version tag (git tag v0.4.0 && git push origin v0.4.0): builds
#     PromakSetup-<version>.exe and publishes it on the Releases page;
#   - by hand (Actions -> release -> Run workflow): builds it and keeps it
#     as a downloadable artefact of the run.
#
# Before packaging, the built program is started in self-test mode: it must
# load every tool, its logo and every component, or the release stops.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # to publish the installer on the Releases page

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Promak and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Version
        id: version
        shell: bash
        run: echo "value=$(python -c 'import promak; print(promak.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Build the program
        run: pyinstaller packaging/promak.spec --noconfirm
      - name: Self-test of the built program
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PROMAK_SELFTEST: ${{ runner.temp }}\selftest.txt
        run: |
          $p = Start-Process -FilePath "dist\Promak\Promak.exe" -PassThru -Wait
          Get-Content $env:PROMAK_SELFTEST
          if ($p.ExitCode -ne 0) { Write-Error "The built program is incomplete (exit $($p.ExitCode))"; exit 1 }
      - name: Make the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" packaging\promak.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep the installer with the run
        uses: actions/upload-artifact@v6
        with:
          name: PromakSetup-${{ steps.version.outputs.value }}
          path: dist/PromakSetup-*.exe
          if-no-files-found: error
      - name: Publish on the Releases page
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PromakSetup-*.exe
          generate_release_notes: true
